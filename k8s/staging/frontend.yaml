apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockify-staging-frontend
  namespace: stockify-staging
  labels:
    app: stockify-staging-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: stockify-staging-frontend
  template:
    metadata:
      labels:
        app: stockify-staging-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/jayyidjidan/stockify-frontend:d65dff38f7d9011697aa854c9c72ced80d4a64bb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stockify-staging
spec:
  type: NodePort
  selector:
    app: stockify-staging-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
