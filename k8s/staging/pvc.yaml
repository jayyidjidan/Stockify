apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stockify-staging-postgres-pvc
  namespace: stockify-staging
  labels:
    app.kubernetes.io/name: stockify
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
