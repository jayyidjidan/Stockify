apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockify-production-backend
  namespace: stockify-production
  labels:
    app.kubernetes.io/name: stockify-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: stockify
    environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockify-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockify-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: stockify
        environment: production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: ghcr.io/jayyidjidan/stockify-backend:d65dff38f7d9011697aa854c9c72ced80d4a64bb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: JWT_EXPIRES_IN
              value: "7d"
            - name: FRONTEND_URL
              value: "http://localhost"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stockify-production-backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockify-production-backend-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stockify-production
  labels:
    app.kubernetes.io/name: stockify-backend
    app.kubernetes.io/part-of: stockify
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stockify-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
