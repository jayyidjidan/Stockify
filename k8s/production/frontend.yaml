# ---------- Backend ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockify-production-backend
  labels:
    app.kubernetes.io/name: stockify-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: stockify
    environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockify-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockify-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: stockify
        environment: production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: ghcr.io/jayyidjidan/stockify-backend:otel-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: OTEL_SERVICE_NAME
              value: "stockify-backend"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://161.248.116.8:4318/v1/traces"
            - name: JWT_EXPIRES_IN
              value: "7d"
            - name: FRONTEND_URL
              value: "https://stockify.web.id"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stockify-production-backend-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockify-production-backend-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: stockify-backend
    app.kubernetes.io/part-of: stockify
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stockify-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockify-production-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockify-production-backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ---------- Frontend ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockify-production-frontend
  labels:
    app.kubernetes.io/name: stockify-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: stockify
    environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockify-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockify-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: stockify
        environment: production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/jayyidjidan/stockify-frontend:d65dff38f7d9011697aa854c9c72ced80d4a64bb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: stockify-frontend
    app.kubernetes.io/part-of: stockify
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: stockify-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockify-production-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockify-production-frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
