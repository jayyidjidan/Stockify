apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockify-production-frontend
  namespace: stockify-production
  labels:
    app.kubernetes.io/name: stockify-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: stockify
    environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockify-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockify-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: stockify
        environment: production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/jayyidjidan/stockify-frontend:d65dff38f7d9011697aa854c9c72ced80d4a64bb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stockify-production
  labels:
    app.kubernetes.io/name: stockify-frontend
    app.kubernetes.io/part-of: stockify
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: stockify-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
      protocol: TCP
