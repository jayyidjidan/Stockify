apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockify-production-backend
  namespace: stockify-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockify-production-backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockify-production-frontend
  namespace: stockify-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockify-production-frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
