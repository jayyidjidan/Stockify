apiVersion: v1
kind: Namespace
metadata:
  name: stockify-loadtest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-stress
  namespace: stockify-loadtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-stress
  template:
    metadata:
      labels:
        app: cpu-stress
    spec:
      automountServiceAccountToken: false
      containers:
        - name: stress
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                :
              done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 150m
              memory: 32Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-stress
  namespace: stockify-loadtest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-stress
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
